name: Hämta data och publicera appen

on:
  schedule:
    - cron: "17 */2 * * *"   # varannan timme
  push:
  workflow_dispatch:
    inputs:
      force_analysis:
        description: "Skapa en ny daglig analys direkt"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Hämta kurs, nyheter och gör daglig analys
        run: node scripts/fetch-data.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # valfri – ger analystext skriven av Claude
          GRANGEX_SHARES: "6850"
          FORCE_ANALYSIS: ${{ inputs.force_analysis && '1' || '0' }}
      - name: Spara data i repot (bygger upp nyhetsarkivet)
        run: |
          git config user.name "grangex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || (git commit -m "Uppdatera Grangex-data" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

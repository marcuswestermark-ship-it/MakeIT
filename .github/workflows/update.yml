name: Hämta data och publicera appen

on:
  schedule:
    - cron: "17 */2 * * *"   # varannan timme
  push:
  workflow_dispatch:
    inputs:
      action:
        description: "Vad ska göras?"
        type: choice
        options: [update, add, remove, shares, report]
        default: update
      query:
        description: "add: aktiens namn/ticker · remove/shares/report: aktiens id"
        type: string
        default: ""
      shares:
        description: "Antal aktier (för add/shares)"
        type: string
        default: ""
      force_analysis:
        description: "Skapa ny daglig analys direkt"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Automatiska körningar köas efter varandra; körningar från appen (lägg till/ta bort) körs alltid och avbryts aldrig.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || 'auto' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # senaste versionen av grenen, inte den när körningen beställdes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Lägg till / ta bort aktie
        id: manage
        if: ${{ inputs.action == 'add' || inputs.action == 'remove' || inputs.action == 'shares' }}
        run: node scripts/manage.mjs "${{ inputs.action }}" "$QUERY" "$SHARES"
        env:
          QUERY: ${{ inputs.query }}
          SHARES: ${{ inputs.shares }}
      - name: Hämta kurser, nyheter, rapporter och dagliga analyser
        run: node scripts/fetch-data.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # valfri – ger rapporter och analyser skrivna av Claude
          FORCE_ANALYSIS: ${{ inputs.force_analysis && '1' || '0' }}
          FORCE_REPORT: ${{ (inputs.action == 'add' && steps.manage.outputs.id) || (inputs.action == 'report' && (inputs.query || '1')) || '' }}
      - name: Spara data i repot
        run: scripts/save-data.sh
        env:
          WATCHLIST_CHANGED: ${{ steps.manage.outcome == 'success' && '1' || '0' }}
      - uses: actions/configure-pages@v5
      - name: Samla appens filer
        run: mkdir _site && cp -r index.html app.js forecast.js style.css sw.js manifest.webmanifest icons data fotboll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
